# Скопируйте этот файл в config.yaml и заполните.

# Токен бота от @BotFather
token: "ВАШ_ТОКЕН"

# Кому бот отвечает и куда шлёт алерты. Свой chat_id можно узнать,
# отправив боту /start (он ответит, даже если доступа ещё нет).
allowed_chats:
  - 123456789

# Как часто проверять сервер, секунд
check_interval_sec: 60

# Сообщать в Telegram при запуске бота
notify_on_start: true

thresholds:
  cpu: 90          # %, алерт если держится дольше duration_sec
  ram: 90          # %
  swap: 80         # %
  disk: 85         # % заполнения любого диска
  temp: 85         # °C (только Linux, где доступны датчики)
  duration_sec: 300  # сколько должно держаться превышение по ресурсам

# Какие диски проверять. Пусто = все обычные разделы.
# Linux: "/", "/var"   Windows: "C:\\", "D:\\"
disks: []

# Службы: systemd на Linux (nginx, postgresql), службы Windows по имени (Spooler, MSSQLSERVER)
services: []
#  - nginx
#  - postgresql

# Процессы: ищутся по имени или части командной строки
processes: []
#  - python my_script.py
#  - java

# Контейнеры Docker по имени (docker ps). Боту нужен доступ к docker.
containers: []
#  - weather-bot

# ---- Дальше всё можно менять кнопками в боте (меню «Настройки»). ----
# Изменения из Telegram сохраняются в settings.json и перекрывают значения ниже.

# Часовой пояс для тихих часов и сводки
tz: "Europe/Kyiv"

# Тихие часы: в это время приходят только критичные алерты (службы, контейнеры, процессы)
quiet_hours: null
#  start: "23:00"
#  end: "08:00"

# Напоминать о нерешённой проблеме каждые N минут (0 = не напоминать)
remind_min: 60

# Ежедневная сводка в заданное время (null = выкл)
daily_summary: null   # "09:00"

# Docker: отслеживать все контейнеры, которые бот видел работающими (не только из списка containers)
containers_auto: false
# Алерт на ошибки в логах контейнеров, не чаще раза в log_alert_min минут
log_alerts: true
log_alert_min: 15
# Что считать ошибкой (с учётом регистра). null = Traceback, ERROR, CRITICAL, Exception, FATAL
log_patterns: null

# Безопасность (переключается и кнопками в «Настройки → 🛡 Безопасность»)
ssh_alerts: true            # вход по SSH с нового IP и подбор пароля (боту нужна группа systemd-journal)
ssh_alert_all_logins: false
ssh_fail_threshold: 30      # неудачных попыток за 10 минут для алерта
port_alerts: true           # новый открытый наружу порт
update_alerts: true         # обновления безопасности Ubuntu

# Умные алерты (переключаются и кнопками в «Настройки → 🧠 Умные алерты»)
anomaly_alerts: true        # CPU/RAM намного выше обычного для этого часа (нужно 3 дня истории)
ram_trend_alerts: true      # память ровно растёт 6 ч и скоро закончится
group_alerts: true          # больше 3 алертов за раз — одним сообщением

# Проверки снаружи (добавляются и командой /probe, меню «Настройки → 🌐 Сайты и порты»)
probes: []
#  - https://example.com              # сайт отвечает 2xx/3xx, плюс срок SSL-сертификата
#  - "https://example.com/health | OK" # и на странице есть текст OK
#  - tcp://db.example.com:5432        # порт открыт
#  - ping://1.1.1.1
#  - dns://example.com
probe_timeout: 10           # секунд на одну проверку
probe_fail_count: 2         # сколько неудач подряд считать падением
ssl_alerts: true            # предупреждать за 14, 7, 3, 1 день до окончания SSL
ssl_warn_days: 14

# Внешний контроль: бот раз в проверку открывает этот URL. Если сервер или бот упадёт, пинги прекратятся,
# и внешний сервис сообщит вам. Например, бесплатный https://healthchecks.io (Period 1 мин, Grace 5 мин).
heartbeat_url: null         # "https://hc-ping.com/<ваш-uuid>"

# Действия из Telegram (перезапуск, очистка, перезагрузка) — всегда с подтверждением.
actions_enabled: true
# Какие службы можно перезапускать. Тот же список должен быть в /etc/monitor-bot/allowed-services.
action_services: []
#  - docker
#  - cron

# Куда писать settings.json и state.json. Пусто = $STATE_DIRECTORY (systemd) или папка с config.yaml
data_dir: null
